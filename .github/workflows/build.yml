name: Test and build Photoshop band correction
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      native:
        description: Build addons using the private Adobe SDK
        type: boolean
        default: true
      sign_macos:
        description: Developer ID sign and notarize macOS addons (requires secrets)
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: banding-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: photoshop-banding
    steps:
      - uses: actions/checkout@v4
        with:
          path: photoshop-banding
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: photoshop-banding
      - run: cargo fmt --all -- --check
      - run: cargo test --locked --workspace --release
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: node --test tests/plugin.test.js tests/startup.test.js
  native:
    needs: test
    # SDK/signing secrets are never provided to pull-request builds.
    if: github.event_name != 'pull_request' && (inputs.native == true || vars.UXP_NATIVE_BUILDS == 'true')
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win/x64
            artifact: windows-x64
          - os: macos-15
            platform: mac/arm64
            artifact: macos-arm64
            target: aarch64-apple-darwin
          - os: macos-15-intel
            platform: mac/x64
            artifact: macos-x64
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: photoshop-banding
    steps:
      - uses: actions/checkout@v4
        with:
          path: photoshop-banding
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: photoshop-banding
      - name: Download and verify private Adobe SDK
        env:
          UXP_SDK_URL: ${{ secrets.UXP_SDK_URL }}
          UXP_SDK_SHA256: ${{ vars.UXP_SDK_SHA256 }}
        run: python scripts/fetch-sdk.py ../adobe-sdk
      - name: Build Windows addon and run ABI smoke test
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/build-native.ps1 -SdkPath $env:UXP_SDK_PATH
      - name: Build macOS addon and run ABI smoke test
        if: runner.os == 'macOS'
        shell: bash
        env:
          RUST_TARGET: ${{ matrix.target }}
        run: bash scripts/build-native-mac.sh "$UXP_SDK_PATH" "$RUST_TARGET"
      - name: Developer ID sign and notarize macOS addon
        if: runner.os == 'macOS' && inputs.sign_macos == true
        shell: bash
        env:
          APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          BUNDLE_PLATFORM: ${{ matrix.platform }}
        run: bash scripts/sign-mac.sh "$BUNDLE_PLATFORM"
      - name: Assemble development bundle
        env:
          BUNDLE_PLATFORM: ${{ matrix.platform }}
        run: python scripts/bundle.py --platform "${{ matrix.platform }}"
      - uses: actions/upload-artifact@v4
        with:
          name: plugin-${{ matrix.artifact }}
          path: photoshop-banding/dist/plugin/
          if-no-files-found: error
  combined:
    needs: native
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: plugin-*
          merge-multiple: true
          path: plugin
      - uses: actions/upload-artifact@v4
        with:
          name: plugin-all-platforms
          path: plugin/
          if-no-files-found: error
