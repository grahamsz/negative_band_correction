<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="style.css"></head>
<body>
  <div class="settings">
    <h2>Negative Band Correction</h2>
    <p class="intro">Reduce vertical scan bands in the selected image layer, before inversion.</p>
    <p id="status" role="status">Loading engine...</p>
    <label><span>Correction strength (%)</span><input id="strength" type="number" min="0" max="100" step="5" value="100"></label>
    <label><span>Initial layer opacity (%)</span><input id="initialOpacity" type="number" min="1" max="100" step="1" value="66"></label>
    <label><span>Full mask below (%)</span><input id="darkFull" type="number" min="0" max="99" value="10"></label>
    <label><span>Fade mask to zero (%)</span><input id="darkOff" type="number" min="1" max="100" value="60"></label>
    <label><span>Wave layer amplitude (%)</span><input id="boost" type="number" min="50" max="300" step="10" value="50"></label>
    <label class="roi"><span>Detection region</span><input id="roi" type="text" placeholder="X0,X1,Y0,Y1"></label>
    <p class="hint">Region is optional, in document pixels. The fitted correction starts at 66% opacity, with room to increase it.</p>
    <div class="detection">
      <h3>Detected band spacing</h3>
      <p id="detected">Not measured yet</p>
      <p id="resolution" class="hint"></p>
    </div>
  </div>
  <div class="actions"><button id="apply">Create correction layer</button></div>
  <script src="main.js"></script>
</body></html>
