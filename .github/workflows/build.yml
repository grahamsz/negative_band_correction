name: Test and build Photoshop band correction
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      native:
        description: Build addons using the private Adobe SDK
        type: boolean
        default: true
      sign_macos:
        description: Developer ID sign and notarize macOS addons (requires secrets)
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: banding-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: photoshop-banding
    steps:
      - uses: actions/checkout@v4
        with:
          path: photoshop-banding
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: photoshop-banding
      - run: cargo fmt --all -- --check
      - run: cargo test --locked --workspace --release
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: node --test tests/plugin.test.js tests/startup.test.js
  native:
    needs: test
    # SDK/signing secrets are never provided to pull-request builds.
    if: github.event_name != 'pull_request' && (startsWith(github.ref, 'refs/tags/') || inputs.native == true || vars.UXP_NATIVE_BUILDS == 'true')
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win/x64
            artifact: windows-x64
          - os: macos-15
            platform: mac/arm64
            artifact: macos-arm64
            target: aarch64-apple-darwin
          - os: macos-15-intel
            platform: mac/x64
            artifact: macos-x64
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: photoshop-banding
    steps:
      - uses: actions/checkout@v4
        with:
          path: photoshop-banding
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: photoshop-banding
      - name: Download and verify private Adobe SDK
        env:
          UXP_SDK_URL: ${{ secrets.UXP_SDK_URL }}
          UXP_SDK_SHA256: ${{ vars.UXP_SDK_SHA256 }}
        run: python scripts/fetch-sdk.py ../adobe-sdk
      - name: Build Windows addon and run ABI smoke test
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/build-native.ps1 -SdkPath $env:UXP_SDK_PATH
      - name: Build macOS addon and run ABI smoke test
        if: runner.os == 'macOS'
        shell: bash
        env:
          RUST_TARGET: ${{ matrix.target }}
        run: bash scripts/build-native-mac.sh "$UXP_SDK_PATH" "$RUST_TARGET"
      - name: Developer ID sign and notarize macOS addon
        if: runner.os == 'macOS' && inputs.sign_macos == true
        shell: bash
        env:
          APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          BUNDLE_PLATFORM: ${{ matrix.platform }}
        run: bash scripts/sign-mac.sh "$BUNDLE_PLATFORM"
      - name: Assemble development bundle
        env:
          BUNDLE_PLATFORM: ${{ matrix.platform }}
        run: python scripts/bundle.py --platform "${{ matrix.platform }}"
      - uses: actions/upload-artifact@v4
        with:
          name: plugin-${{ matrix.artifact }}
          path: photoshop-banding/dist/plugin/
          if-no-files-found: error
  combined:
    needs: native
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          pattern: plugin-*
          merge-multiple: true
          path: dist/plugin
      - name: Install Adobe packaging tools
        run: npm install --prefix packaging-tools --ignore-scripts --no-audit --no-fund @adobe/uxp-devtools-core@1.2.0
      - name: Package Windows and both Mac architectures in one CCX
        shell: pwsh
        env:
          REQUIRE_ALL_PLATFORMS: 'true'
        run: |
          $env:UXP_PACKAGING_CORE=Join-Path $PWD 'packaging-tools/node_modules/@adobe/uxp-devtools-core'
          node scripts/package-ccx.js
          if ($LASTEXITCODE -ne 0) {throw 'CCX packaging failed'}
      - name: Verify all native binaries are included unchanged
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $manifest=Get-Content -Raw dist/plugin/manifest.json | ConvertFrom-Json
          $ccx=Get-Item "dist/negative-band-correction-*-all-platforms.ccx"
          $zip=[IO.Compression.ZipFile]::OpenRead($ccx.FullName)
          try {
            foreach($platform in @('win/x64','mac/x64','mac/arm64')) {
              $name="$platform/$($manifest.addon.name)"
              $entry=$zip.GetEntry($name)
              if (!$entry) {throw "Missing $name"}
              $stream=$entry.Open()
              try {
                $hash=[Convert]::ToHexString([Security.Cryptography.SHA256]::HashData($stream))
                if($hash -ne (Get-FileHash "dist/plugin/$name").Hash) {throw "Binary changed: $name"}
              } finally {$stream.Dispose()}
            }
          } finally {$zip.Dispose()}
      - uses: actions/upload-artifact@v4
        with:
          name: negative-band-correction-all-platforms-ccx
          path: dist/negative-band-correction-*-all-platforms.ccx
          if-no-files-found: error
  release:
    needs: combined
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: negative-band-correction-all-platforms-ccx
          path: release
      - name: Publish tagged release with combined installer
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          cat > release-notes.md <<'EOF'
          One CCX containing Windows x64, macOS Intel, and macOS Apple Silicon addons.

          Download the CCX below and install it through Creative Cloud.
          Mac addons are ad-hoc signed for testing, not Developer ID signed or notarized;
          local developer loading and macOS security approval may be required.
          Photoshop 25 or newer is required. Host testing on both Mac architectures remains outstanding.
          EOF
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" release/*.ccx --clobber
          else
            gh release create "$RELEASE_TAG" release/*.ccx --verify-tag --prerelease --title "Negative Band Correction $RELEASE_TAG" --notes-file release-notes.md
          fi
